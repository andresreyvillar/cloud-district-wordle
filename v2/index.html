<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- El prefijo del despliegue, declarado UNA vez. Todo lo demás va relativo a él: sin esto, una ruta
       profunda como /2/t/2026-08 resolvería "css/styles.css" contra /2/t/ y se quedaría sin estilos. El
       servidor local monta también en /2/ para que local y producción no difieran. -->
  <base href="/2/">
  <title>Wordle CloudDistrict</title>
  <!-- Relativo al `<base href="/2/">`, así que pide `/2/favicon.svg`. El icono vive **dentro de `v2/`** y no
       en la raíz del repositorio a propósito: el servidor local sirve solo `v2/`, así que un icono en la raíz
       funcionaría en producción y no en local. Esa divergencia entre los dos es la que ya rompió la v2 una
       vez con el `.assetsignore`, y no se repite por ahorrar un fichero. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=Silkscreen:wght@400;700&family=Libre+Baskerville:ital@1&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- La cabecera usa el mismo lenguaje que el cuerpo: barra plana, borde grueso abajo y la marca en
       tipografía de píxeles. Se queda pegada arriba al hacer scroll, que es lo que la convierte en
       navegación de verdad en una tabla de 181 jornadas. -->
  <header class="cabecera">
    <div class="cabecera-interior">
      <a class="marca" href="./" aria-label="Wordle Liga Cloud District, ir a la temporada en curso">
        <span class="pixel">WORDLE</span><span class="pixel resalte">LIGA</span><span class="pixel casa">CLOUD DISTRICT</span>
      </a>
      <nav data-navegacion aria-label="Secciones"></nav>
      <label class="temporada">
        <span>Temporada</span>
        <select data-selector-temporada aria-label="Temporada"></select>
      </label>
    </div>
  </header>

  <main data-vista></main>

  <footer class="pie">
    <p>v2.0 · el marcador se reinicia el día 1 de cada mes · solo cuentan los días laborables</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
