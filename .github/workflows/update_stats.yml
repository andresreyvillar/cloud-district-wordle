name: Hourly Data Update

on:
  schedule:
    # **Vuelta al minuto en punto, contra lo que recomienda la documentación.**
    #
    # GitHub aconseja huir del `:00` porque es el más congestionado, y por eso esto estuvo en `:23`. La medida
    # de ESTE repositorio dice lo contrario: con `0 * * * *` daba 21-23 ejecuciones de 24 al día durante
    # semanas, y con `:23` bajó a entre 2 y 6, con huecos de hasta 18,5 horas. No se conoce el mecanismo —
    # puede ser capacidad reservada en el `:00`, o menos prioridad para un horario recién registrado — así que
    # se vuelve a lo medido en lugar de a lo recomendado. Si el planificador se recupera y esto sigue mal, el
    # siguiente paso es un disparador externo por `workflow_dispatch`, no otro minuto.
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install slack_sdk python-dotenv supabase

      - name: Run Extraction
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 tools/extract_slack.py | python3 tools/add_results.py

      - name: Materialize the running season
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Only the running season: recalculating a closed one is a decision, not a side effect (ADR 0008).
        run: python3 tools/materialize_seasons.py
