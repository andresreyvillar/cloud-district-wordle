name: Hourly Data Update

on:
  schedule:
    # **Minuto 23 y no en punto.** El :00 es el minuto más disputado de GitHub: todo el mundo programa ahí,
    # esa cola es la más larga y la primera que se descarta cuando hay presión. Medido sobre este repo con
    # `0 * * * *`: entre 21 y 23 ejecuciones de 24 en días buenos, y las que salían llegaban con 20-60 min de
    # retraso (:22, :36, :55). El 26 de agosto, con una caída de Actions, se quedó en 16 de 24 y el 27 en 1
    # de 12. Cambiar de minuto no arregla las caídas de GitHub, pero sí la contención del minuto en punto.
    - cron: '23 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install slack_sdk python-dotenv supabase

      - name: Run Extraction
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 tools/extract_slack.py | python3 tools/add_results.py

      - name: Materialize the running season
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Only the running season: recalculating a closed one is a decision, not a side effect (ADR 0008).
        run: python3 tools/materialize_seasons.py
