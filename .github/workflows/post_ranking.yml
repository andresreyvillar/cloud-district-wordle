name: Daily Ranking Post

on:
  schedule:
    # Monday to Friday only: a season is its weekdays, so there is no weekend matchday to publish.
    # Running on Saturday would re-publish Friday's, because the matchday comes from the data.
    # **Medianoche de Madrid, y por una razón del juego.**
    #
    # 22:00 UTC son las 00:00 de Madrid en horario de verano. A esa hora el juego **todavía no ha cambiado de
    # palabra**: su índice avanza a medianoche de Nueva York, o sea a las 06:00 de Madrid. Así que a las 00:00
    # la palabra sigue siendo la que el grupo ha jugado todo el día y coincide con la jornada que resume el
    # mensaje; a cualquier otra hora habría desfase de un día.
    #
    # Riesgo de destripar la partida, medido sobre el canal: 2 de 1748 resultados se publicaron entre las
    # 00:00 y las 06:00 de Madrid (0,1%).
    #
    # **Deriva de invierno aceptada por el dueño**: los cron de GitHub son UTC y no saben de horario de
    # verano, así que a partir de finales de octubre esto serán las 23:00 de Madrid.
    #
    # Tres ventanas y todas en minutos que sí se disparaban (:00 y :30). Son seguras porque `post_ranking` es
    # idempotente: publica la primera que entre y las otras dos son red de seguridad.
    - cron: '0 22 * * 1-5'
    - cron: '30 22 * * 1-5'
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

jobs:
  update-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          # `certifi` va explícito aunque hoy llegue como dependencia de supabase: lo usa `contexto_tls()`
          # para verificar el TLS de Slack, y la lectura del canal está envuelta en un `try` que publicaría
          # el resumen sin señales y sin que nadie se enterara si el paquete dejara de estar.
          # `msgpack` lo usa `tools/palabra.py` para descifrar la lista de soluciones del juego. Sin él la
          # línea de la palabra no sale —está envuelta y falla en silencio—, así que va explícito para que
          # una ausencia se vea aquí y no en un mensaje sin palabra que nadie relacione con esto.
          pip install slack_sdk python-dotenv supabase playwright certifi msgpack
          playwright install chromium --with-deps

      - name: Update data before snapshot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 tools/extract_slack.py | python3 tools/add_results.py

      - name: Capture and Post Ranking
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          # Sin estas dos, `leer_resultados()` devuelve vacío y el mensaje sale SIN MEDALLAS. Faltaban:
          # las medallas están implementadas desde el 2026-08-05 y no han salido ni un solo día.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # El corte a la v2: se cambia la variable del repositorio, no el código. Decide TRES cosas a la
          # vez —qué web se fotografía, qué se recorta de ella y a dónde apunta el enlace— porque van
          # juntas en el objetivo: una foto de una web con el enlace de otra es la forma más rápida de que
          # nadie se fíe de ninguna de las dos.
          CAPTURA_OBJETIVO: ${{ vars.CAPTURA_OBJETIVO || 'v1' }}
          # El resumen compuesto: jugador del día, obra del día, marcador, figuras y comentarios. Apagado
          # por defecto para que mergear no cambie solo lo que el grupo lee en el canal.
          RESUMEN_COMPUESTO: ${{ vars.RESUMEN_COMPUESTO }}
        run: python3 tools/post_ranking.py
