name: Daily Ranking Post

on:
  schedule:
    # Monday to Friday only: a season is its weekdays, so there is no weekend matchday to publish.
    # Running on Saturday would re-publish Friday's, because the matchday comes from the data.
    # **Tres ventanas, y en los minutos que sí se disparaban.**
    #
    # El resumen tenía una sola oportunidad al día, así que un descarte del planificador dejaba al grupo sin
    # mensaje. Las tres son seguras porque `post_ranking` es idempotente: comprueba si el canal ya tiene la
    # captura de esta jornada y sale sin hacer nada, así que publica la primera que entre.
    #
    # Estuvieron en `:07` y `:37` para huir del minuto congestionado, y salió mal: con `0 17` el mensaje se
    # publicaba puntualmente a las 17:36-17:39 todos los días, y con `:07` llegó de madrugada, entre siete y
    # ocho horas tarde. Se vuelve a lo medido.
    - cron: '0 17 * * 1-5'
    - cron: '30 17 * * 1-5'
    - cron: '0 18 * * 1-5'
  workflow_dispatch:

jobs:
  update-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          # `certifi` va explícito aunque hoy llegue como dependencia de supabase: lo usa `contexto_tls()`
          # para verificar el TLS de Slack, y la lectura del canal está envuelta en un `try` que publicaría
          # el resumen sin señales y sin que nadie se enterara si el paquete dejara de estar.
          pip install slack_sdk python-dotenv supabase playwright certifi
          playwright install chromium --with-deps

      - name: Update data before snapshot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 tools/extract_slack.py | python3 tools/add_results.py

      - name: Capture and Post Ranking
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          # Sin estas dos, `leer_resultados()` devuelve vacío y el mensaje sale SIN MEDALLAS. Faltaban:
          # las medallas están implementadas desde el 2026-08-05 y no han salido ni un solo día.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # El corte a la v2: se cambia la variable del repositorio, no el código. Decide TRES cosas a la
          # vez —qué web se fotografía, qué se recorta de ella y a dónde apunta el enlace— porque van
          # juntas en el objetivo: una foto de una web con el enlace de otra es la forma más rápida de que
          # nadie se fíe de ninguna de las dos.
          CAPTURA_OBJETIVO: ${{ vars.CAPTURA_OBJETIVO || 'v1' }}
          # El resumen compuesto: jugador del día, obra del día, marcador, figuras y comentarios. Apagado
          # por defecto para que mergear no cambie solo lo que el grupo lee en el canal.
          RESUMEN_COMPUESTO: ${{ vars.RESUMEN_COMPUESTO }}
        run: python3 tools/post_ranking.py
