<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Analytics</title>
    <!-- El mismo icono que la v2, que es donde vive. Quien tenga guardada esta URL también lo ve, y la
         dependencia va en la dirección correcta: lo viejo apunta a lo nuevo, no al revés. -->
    <link rel="icon" type="image/svg+xml" href="/2/favicon.svg">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
    <h1>Wordle Analytics</h1>
</header>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" data-tab="ranking">Ranking</button>
        <button class="tab-btn" data-tab="stats">Estadísticas</button>
        <button class="tab-btn" data-tab="graph">Evolución</button>
        <button class="tab-btn" data-tab="data">Datos</button>
    </div>

    <!-- Pestaña 1: Ranking -->
    <div id="ranking" class="tab-content active">
        <div id="summary-container"></div>
        <div id="bubble-chart" class="chart-container" style="height: 500px;"></div>
    </div>

    <!-- Pestaña 2: Estadísticas -->
    <div id="stats" class="tab-content">
        <table>
            <thead>
                <tr>
                    <th>Usuario / Constancia</th>
                    <th>Partidas</th>
                    <th>Media</th>
                    <th>Distribución (1-6)</th>
                    <th>% Éxito</th>
                </tr>
            </thead>
            <tbody id="statsBody"></tbody>
        </table>
    </div>

    <!-- Pestaña 3: Evolución -->
    <div id="graph" class="tab-content">
        <div id="plotly-graph" style="width:100%; height:600px;"></div>
    </div>

    <!-- Pestaña 4: Datos -->
    <div id="data" class="tab-content">
        <div style="max-height: 600px; overflow-y: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Usuario</th>
                        <th>Wordle #</th>
                        <th>Intentos</th>
                    </tr>
                </thead>
                <tbody id="dataBody"></tbody>
            </table>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/script.js"></script>

</body>
</html>
