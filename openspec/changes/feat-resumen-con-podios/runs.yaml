    coverage: pass
    gates-mecanicos: pass
    tdd-rojo: pass
  rondas_correccion: 1
  notas: >-
    El dueño pide los tres rankings del resumen como podio ASCII (bloques macizos) en orden general, juego y
    figuras, y un resumen consciente del momento del mes (arranque, mitad, recta final de cinco laborables,
    última jornada). Modificación de resumen-diario-compuesto: top-cinco-con-su-dibujo y cabeza-del-album se
    sustituyen por podios; se añaden trece escenarios.

    Una corrección antes de escribir: la vista previa que se enseñó al dueño decía que un empate a final de
    mes lo gana quien más días ha jugado. Es falso: `standings.clasificacion` comparte puesto a igual media
    publicada, y los días jugados solo ordenan la lista. El slice dice «comparte el primer puesto».

    Fuera de alcance declarado: la alcanzabilidad del marcador general (no es exacta con la media imputada) y
    el emoji del dibujo del día en el marcador (descuadra el bloque de código). Los fixtures se comprobaron
    contra el código real antes de dar los tests por buenos.

- run: '2026-09-30T13:00:00Z'
  fase: implement
  actor: fabrica
  modelo: claude-opus-5-5
  gates:
    validate: pass
    coverage: pass
    gates-mecanicos: pass
    tests: pass
    mutacion: pass
  rondas_correccion: 3
  notas: >-
    Implementado y visto en local sin escribir en producción: la instantánea se calculó en local con los datos
    reales y se sirvió a la web interceptando la petición; el resumen se imprimió con local_stack --seco.
    Cambios pedidos por el dueño a mitad: las estrellas pesan más que el tiempo (ranking del nivel, regla de
    mejora en la base de datos, puntos por puesto y ganador del resumen); un fin de semana no crea nivel, así
    que el del viernes se juega hasta el lunes; una línea en blanco entre el título y cada podio.

    Mutación, once errores derivados de lo que prohíben los deltas, cada uno en rojo en su escenario. Dos
    tests del podio buscaban cada podio por su posición —el segundo bloque de código era «el del juego»— y un
    cambio de orden los tumbaba a todos; ahora buscan por título. Dependencias legítimas declaradas: quitar el
    filtro de días de temporada cambia también cuántos niveles lleva el mes. Un `checks:` con YAML inválido se
    descartaba en silencio (lección del 2026-09-30).

