  notas: >-
    El dueño pidió que el resumen leyera e interpretara los comentarios del hilo. Se detectó colisión de
    trigger con `voz-de-la-jornada` —mismo cron y su detalle es literalmente «lee el canal del día y le pone
    voz al resumen»—, así que esto es una modificación significativa de ese slice y no uno nuevo. El cambio
    revierte a propósito un «fuera de alcance» declarado en él («leer hilos completos… sería traer
    conversación al sistema») y solo hasta donde hace falta: el contenido se lee en el borde y de vuelta entra
    una clasificación cerrada, así que al sistema sigue sin llegar conversación. La decisión que sostiene el
    diseño es que el modelo clasifica y el repositorio habla, y su motivo es medido y no teórico: en este
    canal la gente ya le escribe al bot, así que publicar prosa de un modelo que acaba de leer el canal
    dejaría que cualquiera le dictase lo que dice sobre un compañero identificable.

