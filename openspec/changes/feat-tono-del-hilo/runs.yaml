  notas: >-
    El proveedor cayó a mitad de implementación. El plan era GitHub Models con el `GITHUB_TOKEN` del propio
    workflow y sin secreto nuevo, y al comprobarlo contra la API —como mandaba `tasks.md`— devolvió
    `410 github_models_retirement_brownout`: retirado del todo el 2026-07-30. De ahí que el borde quede sin
    proveedor cableado, con URL, clave y modelo por entorno en formato OpenAI-compatible; atar el repositorio
    a otro concreto repetiría el error. Coste declarado: hace falta un secreto nuevo y hasta que exista el
    slice está apagado, que además es el orden correcto para mandar conversación del canal a un tercero.

    Dos rondas de corrección, las dos por tests que no medían lo que decían medir. (1) `_autor_del_hilo`
    elegía al más respondido de cualquier mensaje mientras que `hilo_a_clasificar` solo mira mensajes de
    resultado de la jornada: el día que la charla levantara más respuestas que ninguna partida, la frase
    habría nombrado a una persona y la clasificación habría sido de la conversación de otra. (2) El test que
    lo fijaba era vacuo —el charlatán no tenía fila en la tabla, así que su nombre no se resolvía y la
    aserción pasaba por accidente—; reescrito dándole fila de otra jornada, y entonces la mutación sí lo mató.

    Cinco mutaciones, las cinco cazadas por el escenario correcto: aceptar un tono fuera del catálogo →
    `una-clasificacion-invalida-no-se-usa`; ignorar la temperatura mínima → `un-hilo-tranquilo-no-se-llama-juicio`;
    no callar la mención de comentado en una acusación → `el-recuento-de-respuestas-deja-de-ser-aplauso`;
    ignorar quién jugó al elegir autor → `el-hilo-del-dia-se-clasifica`; quitar el recorte del bloque de
    código → `una-clasificacion-invalida-no-se-usa`.

    Hallazgos previos NO tocados, cada uno con su evidencia: `verify slice --strict` ya fallaba en `main`
    por una anotación `@scenarios` huérfana en `test_senales.py`, y la frase «Lo ha bordado {jugador}:
    {intentos} intentos» publica «1 intentos» cuando alguien resuelve en uno.

