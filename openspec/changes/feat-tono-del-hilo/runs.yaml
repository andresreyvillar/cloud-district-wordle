  notas: >-
    Gate 4d. Dos verificadores independientes sostuvieron **siete** refutaciones, todas ciertas, y la suite
    estaba verde con las siete vivas. Vale la pena separarlas en dos grupos, porque enseñan cosas distintas.

    Fallos de diseño (tres). La anonimización no anonimizaba: tapaba la etiqueta de quien habla y dejaba el
    contenido intacto, así que una mención normal en un hilo mandaba el identificador de Slack de un
    compañero al tercero. La frase podía señalar a quien no era: deducir el autor del recuento de respuestas
    permitía que respondiendo cincuenta veces a un mensaje intrascendente de otra persona el bot la acusara
    a ella; ahora el autor lo pone el borde y el modelo no puede ponerlo. Y `dudan` no tenía tope, siendo
    una cifra que se publica.

    Fallos de seguridad (dos). `urllib` reenvía la cabecera `Authorization` en una redirección a otro host
    —`requests` la corta, `urllib` no—, comprobado con dos servidores locales: un endpoint caducado se
    llevaba la clave. Y el comentario que escribí afirmando que el tope de lectura acotaba el tiempo era
    **falso**: `timeout` es por operación de socket, y medido con un byte por segundo la lectura bloqueó 40 s
    con un plazo declarado de 2. Ahora la petición va en un hilo demonio con plazo total, el destino se
    exige https, no se siguen redirecciones y el workflow declara `timeout-minutes`.

    Tests vacuos (dos, más uno). Añadir a `Tono` un campo de texto poblado por el modelo y concatenarlo en
    la frase dejaba la suite verde: el guardián miraba claves concretas en vez de la forma del objeto. Meter
    al registro «{jugador} hizo trampas y el canal lo sabe» también: el guardián comprobaba dos subcadenas
    literales. Y el test de determinismo llamaba dos veces en el mismo proceso, así que probaba idempotencia
    y no reproducibilidad — una elección por `hash()` lo pasaba y daba frases distintas en cada cron.

    Doce mutaciones en total, las doce cazadas por el escenario correcto tras reforzar.

    Hallazgo fuera de este cambio, verificado a mano y **más grave que todo lo anterior**: el lote de la
    ingesta une los mensajes con saltos de línea sin escaparlos, así que un mensaje de Slack multilínea
    inyecta un `USER_START` falso y crea un jugador con el nombre que elija quien lo escribe, que acaba
    publicado en el canal y en la web pública. Está en `main` y pide su propio arreglo con prioridad.

