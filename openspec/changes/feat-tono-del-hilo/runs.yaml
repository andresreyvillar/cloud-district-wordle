    El dueño leyó el registro y lo cortó: «el mensaje es demasiado serio, tómalas en plan jocoso como una
    burla en plan de broma; los mensajes de reacción suelen ser amistosos y burlones». Y una segunda cosa,
    que es la que de verdad manda: «solo se tomarán decisiones cuando te lo pida yo».

    Las 35 frases estaban escritas en registro judicial —vistas orales, fiscales, expedientes, comisiones de
    investigación— y sonaban a que el marcador estaba juzgando a un compañero, que es justo lo contrario de
    cómo habla ese canal. Reescritas enteras en cachondeo de grupo: «5 personas y un borrador de reglamento.
    {jugador}, mira lo que has hecho».

    Queda fijado por test, porque es una deriva fácil de repetir: ninguna frase del registro puede llevar
    vocabulario de juzgado. La mutación que devuelve «ha sido una vista oral» al registro lo pone en rojo.
