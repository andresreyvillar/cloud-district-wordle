  notas: >-
    Cambio de última hora del dueño: palabras y no frases, el Wordle de siempre, todas seguidas con «Siguiente palabra
    k/N»; lista de participantes precargada en diez grupos; puntos por palabra con tiempo e intentos (30 s por intento,
