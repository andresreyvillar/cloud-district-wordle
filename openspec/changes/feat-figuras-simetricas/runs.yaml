    marginales, eran flores legítimas. Corregido poniendo el espejo EN ÚLTIMO LUGAR, con lo que gana un
    invariante verificable: solo puede ascender abstractos, ninguna figura se pierde.
    LA TOLERANCIA SE DESCARTA: admitir una celda rota lleva la cobertura del 1,1% al 7,7% y cuesta una ficha
    del conjunto dorado. Mismo canje que tumbó al primer candidato — mejor reparto, menos acierto.
