  notas: >-
    SLICE NUEVO. Comparte el cron `0 17 * * 1-5` con resumen-diario-compuesto, comentarios-de-la-jornada,
    captura-apunta-a-la-v2 y medallas-en-el-resumen-diario, y se distingue por el `detail` — que es el
    precedente que esos cuatro ya establecen.
    EL DISEÑO CAMBIÓ DOS VECES DURANTE LA PROPUESTA, las dos por aportación del dueño. La primera versión era
    solo un diccionario de frases con el registro elegido por `dificultad()`. El dueño propuso LEER EL CANAL
    DEL DÍA antes de publicar, y eso convirtió en medible lo que la versión anterior declaraba fuera de
    alcance: el madrugador, el rezagado, el más aplaudido y el más comentado. La lectura pasó a ser el eje.
    POR QUÉ EL MADRUGADOR NO ERA POSIBLE ANTES: `created_at` lo escribe el cron por lotes cada hora, y solo el
    34% de los resultados de una jornada tienen minuto distinto. El `ts` del canal tiene resolución de
    segundos. Y la hora real YA se extrae en extract_slack.py:114 y add_results.py la descarta.
    MEDIDO ANTES DE PROMETER EL PREMIO: el canal usa reacciones de forma abundante —los buenos resultados
    acumulan 6-9 `boom`— y hay hilos de 37 y 14 respuestas. El premio al más aplaudido no saldría desierto.
    NO SE PERSISTE NADA, y la segunda razón es de corrección y no de comodidad: las REACCIONES SON UN DATO
    VIVO, así que guardarlas en la ingesta horaria las congelaría a media mañana. Leerlas a las 17:00 cuenta
    el día completo. Confirmado por el dueño en la misma vuelta.
    LICENCIA, y es la razón por la que el diccionario está escrito como está: el dueño pidió memes, frases de
    televisión y de foros. El refrán tradicional y el proverbio asiático son de dominio público y van tal
    cual; un guion o un post de Reddit son obra de terceros y el repositorio es PÚBLICO, así que ese registro
    se escribe original en lugar de copiarse. El meme del día es plantilla de TEXTO y no imagen: el bot tiene
    `files:write` y subir una imagen ajena sería un problema de derechos y de permisos a la vez.
    GATE DE COBERTURA CAZÓ UN ESCENARIO HUÉRFANO: `las-frases-no-se-pisan` estaba anotado en el test y había
    desaparecido del slice al reescribirlo. Devuelto al slice, no borrado del test.
    DEUDA DECLARADA PARA LA FASE 3: los umbrales de madrugador y rezagado SE MIDEN antes de fijarlos, con el
    criterio de que la mención salga en una minoría clara de las jornadas. Y el dueño revisa qué frases no
    suenan al grupo: el chiste lo conoce él.
    FASE 4 CON REVISIÓN DE SEGURIDAD (4e): toca el token de Slack y publica en el canal del grupo. Dos
    riesgos por spec, y los dos hay que comprobar en vez de suponer — que el texto de un mensaje del canal
    acabe en el mensaje publicado o en un test, y que el bot suba una imagen.

