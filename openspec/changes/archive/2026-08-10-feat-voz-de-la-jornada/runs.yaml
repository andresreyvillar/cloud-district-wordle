  notas: >-
    IMPLEMENTADO: senales.py (deriva del canal, sin texto) · voz.py (frase, menciones, meme, tope) ·
    refranero.py (solo datos) · resumen.py:_voz (cruce con la tabla) · post_ranking.leer_el_canal (borde) ·
    preview_resumen.py (mira el mensaje sin publicarlo) · calibrate_menciones.py (solo lee).
    UMBRALES MEDIDOS SOBRE 187 JORNADAS REALES, no elegidos redondos. Madrugador 60m → 24% de las jornadas;
    rezagado 240m → 24%. La asimetría es real: la mañana está apelotonada y sacar una hora ya destaca, la
    tarde está dispersa y con menos de cuatro horas «llegar tarde» le pasa a 2 de cada 3 jornadas — eso es
    una columna, no una mención. Más aplaudido sale el 87% (es un premio, se acepta); más comentado el 28%.
    EL TOPE DE 3 AÑADIDOS lo decidió el dueño al presentarle el plan: lo especificado sin límite encadenaba
    doce bloques. Mensaje final medido: 987 caracteres contra el límite de 3000 de Slack.
    CONTRADICCIÓN ENTRE DOS ESCENARIOS DEL MISMO SLICE, resuelta al implementar: si las pullas de líder
    contaban dentro del tope, `el-lider-del-marcador-tiene-su-pulla` dejaba de cumplirse en las jornadas
    movidas. Se dejan FUERA del tope, pegadas a los rankings que ya salen siempre.
    UN TEST DE OTRO SLICE CAZÓ UN FALLO REAL: `test_el_mensaje_no_crece_con_el_numero_de_jugadores` se puso
    rojo porque la mención de ausentes los nombraba a todos — con 30 jugadores el mensaje pasaba de 754 a
    1483 caracteres. Añadido MAXIMO_NOMBRADOS=2: por encima, la mención no se concede. Señalar a doce no
    señala a nadie.
    MUTACIÓN: 6 mutantes, 1 superviviente. Los umbrales medidos NO ESTABAN PROTEGIDOS por ningún test —
    bajar el rezagado de 240 a 30 dejaba la suite en verde. Reforzado con tests que fijan cada umbral y
    comprueban el borde (59m no madruga, 239m no rezaga). Y el filtro del bot tampoco: el test le pasaba al
    bot un mensaje que ES_RESULTADO ya descartaba por otro camino, así que quitar el filtro no rompía nada.
    Reforzado sobre el HILO, que se cuenta antes de ese filtro. Segundo test vacuo mío que caza el gate.
    ADVERSARIAL: dos refutaciones sostenidas, el mismo defecto. Un `ts` no numérico o un `count` nulo hacían
    estallar la derivación ENTERA: el envoltorio del borde lo capturaba y el resumen salía sin NINGUNA
    mención. Fallo total donde tocaba degradación. Ahora se salta el mensaje raro y los demás cuentan.
    SEGURIDAD (4e): el repositorio es PÚBLICO, así que los logs de Actions también. El aviso de fallo
    imprimía el objeto de excepción entero; ahora solo el tipo. El token viaja en cabecera y no debería
    aparecer en el texto de un error, pero «no debería» no basta cuando el coste es un token expuesto.
    Verificado además: senales.py/voz.py/preview no tocan el token, `Senales` no tiene ningún campo de texto
    donde pudiera colarse una conversación, y el meme es plantilla de texto (el bot no sube imágenes).
    EL PREVIEW CAZÓ DOS FALLOS QUE 33 TESTS EN VERDE NO VIERON: «Andrés R..» —doble punto, porque varios
    nombres del grupo acaban en punto— y que las pullas de líder NO SALÍAN en el mensaje aunque
    `pullas_de_lideres` estaba en verde: probaba la función y no su uso. Añadido test de integración contra
    el texto publicado.
    DEUDA REPORTADA, NO TOCADA: `comentarios.py` ya tiene un detector de rezagado (HORA_DEL_REZAGADO=14) que
    usa `created_at`, el dato que no sirve. Ahora hay dos detectores del mismo fenómeno y el nuevo tiene
    mejores datos. Retirar el viejo toca un slice aceptado: lo decide el humano.
