    (hacen falta 5 jugadores por jornada y día laborable) y los seis tests fallaban por eso, no por la
    implementación. Gate 4c a la segunda: el primer intento usaba `git restore --source=:0`, que no
    resolvía, así que las cuatro mutaciones se acumularon y el aislamiento era falso; repetido con copia
    de respaldo, cada mutación mata exactamente su escenario.

