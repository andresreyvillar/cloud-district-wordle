    etiquetado heredado del repo. Se extrajo resolver_formas() como función pura y se cubrió con tres
    tests. 6 mutantes, 0 supervivientes.
    SECURITY (4e) — el update envía solo slack_user_id; player_name no se toca (lo lee la web v1); la
    copia de seguridad de las 1533 filas está fuera del repo; el informe no volca nombres a ningún archivo.

