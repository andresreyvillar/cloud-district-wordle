    arregladas: resueltas 1233, ya_canonicas 290, cruzadas 8, no_resueltas 0 — las cifras del análisis.
    El primer ensayo también iba a FUSIONAR 2 PARTIDAS DE UN JUGADOR DENTRO DE LAS DE OTRA porque sus
    puntuaciones coincidían: pérdida de datos disfrazada de fusión, evitada por el ensayo.
    RONDA 2 — CAMBIO DE ESPECIFICACIÓN. El slice decía eliminar las 8 filas cruzadas "porque no son
    partidas jugadas". Los datos dicen lo contrario: son partidas de un jugador bajo el identificador de
    otra, y DOS de ellas (#1477 y #1488) no existen bajo el identificador correcto, así que borrarlas
    perdía dos partidas. Cambiado a reatribuir + fusionar duplicados; el delta de resultados se corrigió
    para que el censo solo baje por fusión.
    RONDA 3 — MUTANTE SUPERVIVIENTE, Y ERA EL PEOR POSIBLE. El mutante que convertía el mapeo curado de
    relleno en override sobrevivió: no lo cubría ningún test porque vivía dentro del adaptador de Slack.
