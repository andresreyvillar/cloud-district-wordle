    LA PRIMERA EJECUCIÓN REAL FALLÓ A MITAD con violación del índice único
    (slack_user_id, wordle_id)=(U08KF6V12CB, 1478). Estado tras el fallo: 1533 filas intactas, 0 borrados,
    18 identidades reescritas — todas correctas, y el proceso es idempotente, así que no hubo daño.
    CAUSA RAÍZ: el diseño calculaba bien el destino de cada fila pero escribía sin mirar quién ocupa la
    clave EN ESE INSTANTE. La fila de una jugadora necesitaba una clave que ocupaba la fila cruzada que se
    iba a borrar después. Y peor: en el puzzle 1481 la fila conflictiva —que por definición se queda donde
    está— se sienta sobre la clave que necesita su dueña legítima, y eso no lo resuelve ningún orden.
    POR QUÉ LOS TESTS NO LO CAZARON: el doble en memoria NO imponía el índice único, así que era más
    permisivo que producción. Un doble que acepta lo que la tabla rechaza no prueba nada sobre la tabla.
    ARREGLO: (1) TablaFalsa impone el índice único y lanza como Postgres; (2) borrar antes de escribir, que
    libera claves; (3) escribir por punto fijo, y lo que siga bloqueado se declara (bloqueadas) sin forzar
    ni borrar. Escenario nuevo clave-ocupada-se-declara-y-no-se-fuerza con dos tests, las dos formas reales
    (#1478 se desbloquea al borrar, #1481 no se desbloquea nunca).
    EJECUCIÓN REAL: resueltas=1214 ya_canonicas=308 fusionadas=9 cruzadas=8 no_resueltas=0 conflictivas=1
    bloqueadas=1. Suma 1533 con las 18 de la ejecución fallida.
    VERIFICADO CONTRA LA BASE DE DATOS Y CONTRA EL RESPALDO: 1524 filas (1533-9); 1523 con identificador y
    1 con nombre (la bloqueada); 0 columnas intocables alteradas (player_name, wordle_id, score, date,
    pattern); 0 filas nuevas; las 9 borradas tienen gemela viva bajo la identidad resuelta; el renombre
    quedó en 15 partidas bajo un solo identificador sin duplicados; #1477 y #1488 PRESENTES bajo su dueño.
    PENDIENTE Y URGENTE: el extractor sigue emitiendo nombres mostrados (main, sin cambiar), así que el
    cron horario reinsertará identidades de nombre junto a las canónicas. Es recuperable —la migración es
    idempotente y fusiona los duplicados— pero exige el slice ingesta-por-id-de-slack ya.
    PENDIENTE: backfill_patterns.py busca la fila por nombre mostrado y ahora no encuentra ninguna
    (0 rellenadas de 299). Hay que cambiarlo a buscar por identificador, que es lo que la columna guarda.

