    RONDA 1 — EL DIRECTORIO NO ERA EL QUE EL ANÁLISIS SUPUSO. El primer ensayo dio fusionadas=2 y
    cruzadas=0 contra las 4 y 8 declaradas, así que se paró (tarea 5.1). Dos causas: (a) el directorio
