    Punto 6.2. Cinco medallas que miran el dibujo, y con ellas el eje de figuras queda completo.
    LOS UMBRALES DEL BRIEF NO VALÍAN Y EL PROPIO BRIEF LO DECÍA: estaban medidos con el clasificador
    desmentido. Rehechos sobre 122 pares jugador-mes: Florista pedía 5 flores y la lograba el 63% cuando
    quería ser «raro, 8%»; Abstract@ pedía 12 abstractos y la lograba el 0,8% cuando quería ser «común,
