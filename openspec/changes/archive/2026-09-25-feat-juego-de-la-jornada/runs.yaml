    El dueño pidió un GIF tutorial del pisotón «la primera vez que debes usarlo». Se interpretó literal: sale
    justo antes del primer muro que el salto normal no sube, una vez por navegador, con la partida en pausa
    —leer cómo se salta no puede costar tiempo en el ranking— y con un enlace en la guía para repetirlo. El
    sitio lo calcula el motor con su propia física, y cuenta como muro solo lo apilado sin huecos, que es la
    corrección que ya hubo que hacerle al análisis.

    El GIF se graba del motor real con Playwright, capturando fotogramas desde dentro del juego para que cada
    rótulo caiga en su paso. Tres rondas de corrección, las tres de ese GIF y ninguna del código: salía
    «¡Nivel completado!» porque el escenario de prueba tenía la bandera al alcance; dos pasos duraban 200 ms y
    no se podían leer, y se congelan medio segundo; y las teclas del panel no tenían estilo.

    Una prueba falló por sí sola: la de la pausa comparaba capturas de la zona del lienzo y el panel quedaba
    encima con el GIF animándose. Repetida ocultando el panel un instante, la partida está parada; y un control
    con el tutorial cerrado demuestra que el mismo método sí ve correr el cronómetro.

    Una defensa añadida al releer: pedir `localStorage` puede lanzar en navegación privada, y como estaba
    dentro de la carga del motor habría acabado en «no se ha podido cargar el juego».

