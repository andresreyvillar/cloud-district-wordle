    Una ronda de corrección, del análisis: la captura del laboratorio enseñó que la «torre de 6» de Luis era un
    verde en el suelo y un naranja flotando a altura 6, con cuatro casillas vacías en medio. El análisis contaba
    la altura máxima de cada columna y trataba como muro los bloques que flotan sobre un hueco, así que
    **exageraba**: con paredes sólidas, el salto normal deja 138 de 221 niveles sin pasarse desde el suelo, no
    192. Se le corrigió al dueño, porque ese número le había hecho decidir. Y otra, menor, sobre una
    predicción: por la fórmula, 5 casillas justas no pasaban un muro de 5; el motor sube 5,16 y sí lo pasa,
    con 5 px de margen que dependen de la duración del fotograma. Queda documentado para Joel.

