    **Abrir la página destapó un fallo que la suite entera en verde no veía.** La vista caía en «todavía no hay
    una jornada cerrada» con datos reales. Causa: la web normaliza las filas (`jornada`, `nombre`, `intentos`,
    `patron`) antes de dárselas a las vistas, y el generador leía los nombres crudos de la tabla
    (`wordle_id`, `player_name`), así que todo le llegaba `undefined`. Los tests no lo vieron porque sus
    fixtures tenían la forma de la tabla y no la de la web: el test comprobaba el generador contra una entrada
    que la web nunca le da. Corregido, y el fixture pasa ahora por el `normalizar()` real; revirtiendo un solo
    campo al nombre crudo se ponen 9 tests en rojo.

    Verificación final de extremo a extremo: el motor de Joel, sin modificar, con su nivel sustituido por el
    que genera esta pestaña a partir de la tabla. Renderiza sin errores, 15 tramos con los nombres canónicos y
    `⭐ 0 / 15`. Es la prueba del contrato: una pieza se escribió leyendo la otra y encajan sin tocarse.

