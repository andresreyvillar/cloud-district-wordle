  notas: >-
    El dueño decidió un pisotón que saltara una casilla más, «para salvar el reto de hoy», y dejar el resto a
    Joel. Antes de montarlo se comprobó la premisa y **no se cumple del todo**: +1 casilla pasa el muro de 4 de
    Andrés R., pero en la misma jornada Luis levanta uno de 6 y Paula Granado uno de 5. Se pueden pasar solo
    haciendo el pisotón encima del último bloque del tramo anterior y cruzando cuatro columnas en el aire. Se
    montó igual —la decisión sigue teniendo sentido: el nivel queda difícil pero terminable— y se le dijo.

    La velocidad del rebote se deriva de la física (`velocidadDeRebote`) en vez de escribirse, para que siga
    siendo una casilla aunque Joel cambie gravedad o salto. Comprobado en su motor contra un muro de 4: salto
    normal a −520 que sube 3,5 y no pasa; pisotón a −589 que sube 4,7 y pasa.

    Una ronda de corrección, de la prueba y no del código: el primer intento del laboratorio dio «el pisotón
    tampoco pasa». La traza mostró que el pisotón nunca se activaba, porque la prueba pulsaba y soltaba ↓ en el
    mismo instante y el motor detecta con `JustDown`, que Phaser borra al soltar. Manteniendo la tecla 80 ms
    —lo que hace una mano— funciona. Se instrumentó antes de tocar el motor, que no tenía nada que arreglar.

    Hueco de cobertura cerrado con el mecanismo del protocolo: los tests unitarios fijan la fórmula pero no que
    el motor la use, y la mutación «calcula el rebote pero salta normal» los dejaba en verde. Un `checks:` en el
    delta la caza. No hay tests de navegador en el repositorio, y montar el primero —servidor, Chromium y
    Phaser por red en CI— es infraestructura aparte.

