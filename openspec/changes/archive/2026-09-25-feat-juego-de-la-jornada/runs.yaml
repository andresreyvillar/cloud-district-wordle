  notas: >-
    El dueño pidió que quien juegue pueda compartir su puntuación en el canal «igual que se comparten los
    resultados de Wordle». Se hace exactamente así: la página escribe el texto y lo copia al portapapeles, y lo
    pega la persona. La web no puede publicar en Slack —es estática y el token del bot vive solo en el
    workflow— y no debe: ese token lleva `channels:history`, y un mensaje pegado por su dueño lleva autor de
    verdad, que es lo que un ranking necesita y un desplegable no da. El formato va con su lector al lado
    (`leerPuntuacion`) y se prueba de ida y vuelta, por si algún día el ranking se saca del canal.

    El dueño preguntó por el camino si el token podía vivir en el código o en Supabase. En el código no: el
    repo es público y Slack revoca los tokens que GitHub encuentra, lo que tiraría también los cron. En una
    tabla tampoco: o la lee la clave pública y es público, o no la lee y la web no puede usarlo. Como secret de
    una Edge Function sí sería seguro, pero resuelve dónde vive el token y no quién firma ni quién puede
    llamar. Si algún día se quiere, con una app de Slack aparte y solo `chat:write`.

    Una ronda de corrección, por un veredicto falso del gate de mutación: un bucle con `IFS='|'` partió el
    código a mutar por su `||`, dejó un error de sintaxis y se leyó como cazada. La mutación real —quitar el
    tope de estrellas— sobrevivía. Añadido el test del `11/10` y repetida la mutación comprobando que el
    módulo compila tras mutar. Siete mutaciones en total, todas cazadas por su escenario.

