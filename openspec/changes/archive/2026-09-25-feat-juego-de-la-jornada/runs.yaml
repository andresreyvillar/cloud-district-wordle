  notas: >-
    El dueño revisó la pestaña y pidió cuatro cosas: quitar la frase de «llega por pull request», que el juego
    se viera («no se está renderizando»), una guía de controles, la fecha junto al número de jornada y que la
    pestaña se llamara SuperWordleBros.

    **El juego se ve porque ahora hay motor.** Se copió el de Joel (`juego/motor.js`) sin tocar física,
    texturas ni controles, con tres adaptaciones marcadas: recibe el nivel por parámetro, se monta en el lienzo
    encajando en su ancho, y avisa al terminar con `superbros:fin`. Phaser se carga solo en esta pestaña. Y al
    cambiar de pestaña el juego se destruye: sin eso seguía corriendo y capturando flechas y espacio en toda
    la web.

    **La fecha destapó un fallo.** La jornada era «la penúltima de la tabla», y eso falla cada madrugada: a las
    00:18 del 25 la tabla acababa en la 1722 —la de ayer— y la pestaña enseñaba la 1721. Ahora es la última
    fechada antes de hoy, con `hoy` entrando desde la carga de la página.

    Dos rondas de corrección, las dos por afirmar algo sin comprobarlo. La guía decía que ↑ y W saltan; el
    motor solo lee `cursors.space`. Y el lienzo dejaba franjas negras porque el hueco era más ancho que la
    resolución del juego; ahora toma la proporción leyéndola del propio motor.

    **Hallazgo abierto, no arreglado a propósito:** jugándolo en el navegador el jugador no pasa del primer
    tramo. Con la física de Joel el salto máximo es 3,52 bloques y una cuadrícula puede levantar hasta 6, así
    que un escalón de 4 es una pared. Al menos 5 de las últimas 30 jornadas tienen un tramo imposible,
    incluida la 1722. Es una decisión de diseño del juego —doble salto, salto más alto o cuadrículas
    atravesables— y es del motor, así que queda documentada en el contrato para Joel y no se toca aquí.

