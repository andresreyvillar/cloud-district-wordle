  notas: >-
    Joel construyó un plataformas donde las cuadrículas del grupo son el escenario. El dueño pidió meterlo en
    la web con pestaña propia, que el juego lo siguiera desarrollando Joel por PR, y que la autoría quedara
    clara. Este paquete es todo menos el juego: el generador del nivel, la pestaña y el contrato.

    **Las reglas del nivel no se inventaron: se dedujeron y se verificaron.** De los dos prototipos (22 y 23
    de septiembre) salen el ancho `N*8+5`, el alto `max(intentos)+3`, el tramo de ocho columnas con la
    cuadrícula en las cinco centrales, las filas de abajo arriba y la etiqueta en `intentos+2`. La prueba es
    que reconstruyendo el `pattern` desde los bloques de Joel sale exactamente el guardado en la tabla, y que
    el generador nuevo reproduce sus escenarios: **20 de 20 jugadores comunes idénticos**.

    Dos reglas se cambian a propósito. La fuente pasa a ser la tabla: el prototipo lee Slack, así que arrastra
    nombres de display —`carlos.h` frente a `Carlos H.`— y pierde a quien no había publicado en el momento de
    generar (Cata y Luis el 22, Andrés R. y Claire el 23; distintos cada día, que es lo que delata la causa).
    Y el coleccionable deja de ser aleatorio —en 23 tramos no encaja ninguna regla deducible— y pasa a
    apoyarse sobre la plataforma más alta del tramo: determinista, como exige §10, y siempre alcanzable.

    Una ronda de corrección, y de la peor clase: **el gate de mutación dio cuatro verdes falsos**. El script
    mutador vivía en el scratchpad de una sesión anterior y había desaparecido, así que las cuatro
    invocaciones fallaron por `No such file or directory` —a stderr— mientras la suite seguía en verde. El
    veredicto «mutación superada» era en realidad «no se mutó nada». Recreado el mutador, las cuatro
    mutaciones caen donde deben: filas al revés → `la-cuadricula-es-el-escenario`; suelo sin cubrir la cola →
    `el-suelo-no-tiene-agujeros`; coleccionable flotando → `el-coleccionable-se-puede-alcanzar`; jornada de
    hoy en vez de la anterior → `el-nivel-sale-de-la-jornada-anterior`.

    Es el mismo patrón que la lección del bytecode cacheado del 2026-08-04: el gate de mutación puede dar un
    veredicto falso **en verde**, y el verde no se distingue de un gate bien pasado si no se comprueba que la
    mutación llegó a aplicarse.

