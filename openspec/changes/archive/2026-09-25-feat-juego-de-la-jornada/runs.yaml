  notas: >-
    El dueño: «no es jugable porque las flechas desplazan el scroll y no permite hacer el pisotón; el scroll
    debería poder hacerse igualmente, pero no con espacio ni las flechas». Reproducido: sin modificadores nada
    movía la página; con Shift, Shift + Espacio la subía de golpe. Causa en el código de Phaser: deja de
    bloquear el scroll de sus teclas cuando va un modificador, y el pisotón se hace corriendo con Shift.

    Arreglo en tres piezas: el motor escucha el teclado en el lienzo (sin foco, las flechas vuelven a la
    página), suelta la rueda, y la página bloquea el scroll de las teclas del juego con cualquier modificador.
    La prueba destapó dos cosas más: la rueda no hacía scroll encima del juego, y un clic no devolvía el foco
    porque Phaser anula la pulsación del ratón.

    Dos rondas de corrección, y la segunda es la importante: el bloqueo iba en el lienzo y se ejecutaba antes
    que Phaser, que descarta las teclas ya bloqueadas, así que **el juego se quedó sin teclas**. La prueba del
    scroll daba verde porque solo miraba la página. Lo cazó repetir las pruebas de juego anteriores. Ahora la
    prueba empieza por «¿el personaje responde?», un `checks:` fija el sitio del bloqueo, y la mutación que lo
    devuelve al lienzo la cazan el gate y el navegador —los tests unitarios no pueden—. Lección registrada.
