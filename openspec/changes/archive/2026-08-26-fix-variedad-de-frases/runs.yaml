    comparación con lo que produce `frase`, que es más estricta; (2) dos aserciones nuevas buscaban literales
    («figura») donde las variantes dicen «lienzos» u «obra», y se pasaron a comparar contra el registro;
    (3) el test del umbral de asamblea comparaba dos textos entre sí, así que bajar el umbral seguía dando
    textos distintos y la mutación M4 pasaba — rehecho contra `None`. Además los propios tests cazaron dos
    defectos del código nuevo: un choque de `total` en el `format` de `nadie-dibuja-nada`, y esa misma
    condición afirmando que nadie dibujó cuando lo que faltaba era el patrón (61 de las 80 partidas de agosto
    no lo tienen).

