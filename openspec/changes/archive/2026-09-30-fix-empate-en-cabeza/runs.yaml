    Mutación: el medallero coronando solo al primero → rojo solo en un-titulo-compartido-corona-a-todos; la
    tarjeta diciendo «va ganando» con empate → rojo solo en un-empate-en-cabeza-se-ve-como-empate; el podio
    con la frase de campeón único → rojo solo en con-empate-en-el-primer-puesto-se-felicita-a-todos. El test
    del podio recorre el ciclo entero de frases, no una jornada suelta.

    Una ronda de corrección, vista en el navegador y no en la suite: «comparten el primer puesto» iba dentro
    de la fila flexible de los nombres y se salía de la tarjeta. Se movió debajo. Comprobado con los datos
    reales: la tarjeta en curso dice EMPATE EN CABEZA · Cata y Joel · 3,64, y el podio del día 1 imprime «Ni uno
    ni otro: Cata y Joel comparten el primer puesto».

