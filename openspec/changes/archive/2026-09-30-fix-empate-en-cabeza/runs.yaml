    Septiembre acaba con Cata y Joel empatados a 3,64. La tarjeta de /temporadas decía «VA GANANDO Cata»
    porque archivo.js tomaba la primera fila de la clasificación; cerrado el mes habría dicho «CAMPEÓN Cata»
