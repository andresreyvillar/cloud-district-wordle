    coinciden. Se resolverán solas cuando la Fase 1 unifique identidades; volver a ejecutar el
    comando entonces es seguro porque es idempotente.
    SECURITY (4e) — el update envía únicamente {"pattern": ...}, nunca un objeto completo que pudiera
    pisar puntuación o fecha; el informe solo cuenta y no volca nombres ni texto de mensajes; la
