    material para un slice de seguridad propio (fuera del alcance de este pack).
    MUTACIÓN — 4 mutantes, todos muertos en su test esperado: escribir siempre en lugar de solo donde
    falta el patrón, detenerse tras la primera página, contar como rellenada una fila inexistente, e
    ignorar dry_run. El guardián de dry_run se volvió a mutar DESPUÉS de reescribir los adaptadores
    para confirmar que seguía protegido, dado que la siguiente ejecución escribe en producción.
