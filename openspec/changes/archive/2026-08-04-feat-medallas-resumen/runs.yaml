  notas: >-
    tools/badges.py con el catálogo declarativo y el cálculo puro; los 8 escenarios iniciales pasaron de
    pendiente a verde. Después, TRES rondas de corrección, y todas las provocó el ensayo o la mutación,
    no un gate mecánico:
    RONDA 1 — CAMBIO DE ESPECIFICACIÓN A PARTIR DEL ENSAYO. El slice decía que el resumen mostrase las
    medallas de la temporada en curso. Con datos reales de julio eso produce tres líneas de hasta diez
    nombres, idénticas veinte días seguidos, porque las medallas comunes las tiene entre el 34% y el 48%
    del grupo. Se cambió a anunciar solo lo ganado EN la jornada: 12 jornadas con anuncio de 25, con una
    a tres líneas cada una. El slice y el delta de publicacion se corrigieron; los escenarios
    medallas-de-temporada-en-el-resumen y permanente-se-anuncia-el-dia-que-se-gana pasaron a ser
    medalla-nueva-se-anuncia y medalla-ya-anunciada-no-se-repite.
    RONDA 2 — BUG PROPIO QUE EL ENSAYO CAZÓ Y LOS TESTS NO. La primera versión de medallas_nuevas
    comparaba el estado anterior contra TODOS los resultados, incluidas las jornadas posteriores, así que
    anunciaba medallas que aún no se habían ganado: el ensayo seguía sacando el muro en 25 de 25
    jornadas. Los tests no lo cazaron porque ningún fixture tenía datos posteriores a la jornada
    evaluada. Arreglado cortando las dos ventanas en la jornada, y añadido un test de regresión con
    futuro deliberado.
    RONDA 3 — MUTANTE SUPERVIVIENTE Y UN TEST QUE NO PROBABA LO QUE DECÍA. El mutante que quitaba la
    muestra mínima del día sobrevivió: ningún fixture tenía un día de pocos jugadores. Al escribir el
    test, la primera versión tampoco lo cazaba porque su media (4.5) quedaba por debajo del umbral del
    día imposible, así que la medalla se denegaba por el umbral y no por la muestra. Recalibrado a media
    5.5 exacta, el mutante muere. El edge case ascendió a escenario propio
    (dia-con-poca-muestra-no-cuenta): 9 escenarios, 9/9 cubiertos.
    MUTACIÓN — 5 mutantes, 0 supervivientes al cerrar: umbral estricto en Fondista, día imposible sin
    condición de dificultad, sin muestra mínima, sección vacía devuelta, y la ventana del "ahora"
    mirando el futuro.
    PENDIENTE: cablear tools/post_ranking.py (tarea 3 del pack). El dominio está listo y verificado
    contra datos reales, pero el resumen todavía no lo publica.

