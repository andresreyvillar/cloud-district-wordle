  notas: >-
    El dueño quiere que en el dashboard haya un botón para Nouha, que la primera vez crea un PIN de cuatro cifras que
    solo ella sabe y desde entonces lo necesita para ver y cambiar las palabras. Es un PIN aparte del del evento,
