    proposals, el roadmap y una lección, estaba MAL: la medí sobre un volcado de una sola página de 1000
    filas. La real es 1234 de 1532. Corregida en los cuatro documentos y registrada como lección con
    destino mecánico (probe row-count que verifique cifras declaradas contra la base de datos).
    Las políticas RLS reales también quedaron registradas en el ADR 0005: una sola política, SELECT para
    public, sin políticas de escritura. Antes eso estaba inferido probando la API; ahora está verificado.
