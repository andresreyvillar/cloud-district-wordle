  notas: >-
    tools/seasons.py con el modelo puro y tools/materialize_seasons.py con la escritura. 7 escenarios, 7/7
    cubiertos, 10 tests. MUESTRA_MINIMA_DEL_DIA se movió a seasons.py y badges.py lo importa de allí: su
    docstring ya decía que quería ser el mismo criterio y ahora lo es de verdad, no por coincidencia.
    TABLA CREADA con RLS, y la RLS se COMPROBÓ en vez de suponerse (Gate 4e): con la clave publicable, el
