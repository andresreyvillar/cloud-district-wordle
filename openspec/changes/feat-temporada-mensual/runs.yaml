    Primer slice bajo el ADR 0008: el cálculo vive en Python y se materializa en season_snapshots. La
    decisión se tomó justo antes de escribir este slice, porque es donde el disparador del ADR 0004 se
    cumplía: el modelo de temporada necesita día laborable, muestra mínima y (en 2.2) imputación, y las dos
