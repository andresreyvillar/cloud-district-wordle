  notas: >-
    Página de reglas pedida por el usuario: los participantes tienen que poder leer todas las reglas que se
    les aplican. Hoy están repartidas entre un hilo de Slack, dos conversaciones de diseño y cuatro briefs.
    DECISIÓN DE DISEÑO CENTRAL: los parámetros NO se escriben a mano. Cada regla referencia la constante que
    el cálculo usa, y un test comprueba que lo publicado es lo aplicado. Sin eso la página miente en cuanto
    alguien recalibre un umbral, y una página de reglas equivocada es peor que no tenerla porque el grupo
    confía en ella.
    Dos marcadores independientes por regla, estado y votada, porque hoy hay reglas APLICADAS Y NO VOTADAS
    —días laborables y el modelo de imputación— y esconderlo sería el peor uso posible de esta página.
    Las reglas viajan dentro de la instantánea de la temporada, así que una cerrada conserva las suyas: mirar
    marzo explica marzo. Es una clave más en la carga útil JSONB, que es para lo que se eligió.
    RIESGO DECLARADO: bajo técnicamente, alto en percepción. Esta página le dice al grupo que se le aplican
    reglas que no votó, y eso es el objetivo, no un efecto colateral. Conviene que alguien lo lleve al canal
    en lugar de que lo descubran solos.

