  notas: >-
    El dueño quiere premiar la rapidez pero sobre todo acertar. Con la regla anterior (1 punto más uno por cada
    resolvedor más lento) el resolvedor más lento sacaba casi lo mismo que quien fallaba, y en la simulación (miles de
    eventos con la distribución real de intentos del canal, palabras difíciles) quien acertaba más palabras quedaba
    delante solo en el 78 % de los casos; en una mañana de ejemplo con la lista cargada, una participante con 3 de 5
